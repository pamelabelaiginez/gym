<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gym</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<script src="jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --petrol:#431E40; --clay:#EF512C; --sand:#FD9651; --cream:#FCE9D2; --ink:#150F14;
  --bg:#FCE9D2; --card:#FFF1DF; --card2:#F8DDBF; --text:#150F14; --mute:#D1BDCC; --line:rgba(67,30,64,.18);
  --hero:#431E40; --herotext:#FCE9D2; --herosub:#FD9651;
  --btn:#EF512C; --btntext:#150F14;
  --g-glu:#EF512C; --g-qua:#FD9651; --g-pos:#EF512C; --g-cos:#431E40; --g-omb:#E39BC7; --g-bra:#FFB27A; --g-pan:#C7ABA0; --g-abd:#150F14;
  --warn1:#FD9651; --warn2:#EF512C; --warntext:#150F14;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150F14; --card:#20181F; --card2:#2D222C; --text:#FCE9D2; --mute:#D1BDCC; --line:rgba(252,233,210,.16);
    --hero:#431E40; --g-cos:#F3C8F3; --g-abd:#FCE9D2; --g-pan:#C7ABA0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150F14; --card:#20181F; --card2:#2D222C; --text:#FCE9D2; --mute:#D1BDCC; --line:rgba(252,233,210,.16);
  --hero:#431E40; --g-cos:#F3C8F3; --g-abd:#FCE9D2; --g-pan:#C7ABA0; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.015em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 190px}
small,.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h3{font-size:20px;margin-bottom:4px}
.card p{margin:4px 0 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--btn);color:var(--btntext);font-weight:700}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);font-weight:600}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.blk{width:100%}
.btn.dark{background:var(--petrol);color:var(--cream)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.dn{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.dnt{flex:1;text-align:center}
.dnt small{display:block;font-size:12px}
.dnt b{font:800 19px "Bricolage Grotesque",Figtree,sans-serif;text-transform:capitalize}
.phrase{text-align:center;font-style:italic;color:var(--mute);margin:0 8px 12px;font-size:15px}
.toToday{display:block;margin:-2px auto 8px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:underline}
.hero{background:var(--hero);color:var(--herotext);border-radius:24px;padding:20px 18px 16px;margin:6px 0 12px}
.hero .k{font-size:15px;color:var(--herosub);font-weight:600}
.hero h1{font-size:46px;font-weight:800;margin:4px 0 2px}
.hero p{margin:0;color:var(--herotext);opacity:.9}
.segs{display:flex;gap:3px;margin:16px 0 8px;flex-wrap:wrap}
.segs i{height:8px;border-radius:4px;background:rgba(252,233,210,.22);flex:1 1 10px;min-width:8px;max-width:28px}
.segs i.on{background:var(--clay)}
.hm{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.hm b{font:800 26px "Bricolage Grotesque",Figtree,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(252,233,210,.14);color:var(--herotext)}
.card .chip{background:var(--card2);color:var(--text)}
.chip.fut,.card .chip.fut{background:var(--clay);color:var(--ink)}
.chip.night,.card .chip.night{background:var(--sand);color:var(--ink)}
.card .chip.no,.wd .chip.no{background:transparent;border:1px solid var(--line);color:var(--mute)}
.card .chip.fin,.wd .chip.fin{background:var(--petrol);color:var(--cream)}
.wkp{display:flex;justify-content:space-between;margin:2px 0 12px}.wkd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:40px}.wkc{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}.wkc svg{width:18px;height:18px;color:var(--ink)}.wkd.on .wkc{background:var(--clay);border-color:var(--clay)}.wkd.td .wkc{border-color:var(--clay)}.wkd small{font-weight:600}.wkd.cu small{font-weight:800;color:var(--text)}.hm .gotr{min-height:40px;padding:0 14px;border-radius:999px;background:var(--clay);color:var(--ink);font-weight:700;font-size:14px}.exinfo{font-size:13.5px;margin-top:10px;color:var(--herosub)}
.ckc{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg)}.ckc svg{width:20px;height:20px;opacity:0}.ckc.on{background:var(--clay);border-color:var(--clay)}.ckc.on svg{opacity:1;color:var(--ink)}
.ex.cur{border-color:var(--clay)}.ex.fin{opacity:.9}.exr{display:flex;align-items:center;gap:12px;padding:8px 12px}.exrb{text-align:left;flex:1;min-width:0}.exrb b{display:block;font:700 16px/1.2 "Bricolage Grotesque",Figtree,sans-serif}.exrb small{display:block}
.ico{display:inline-flex;vertical-align:-4px;margin-right:6px;color:var(--clay)}.ico svg{width:20px;height:20px}.ci{display:inline-flex}.ci svg{width:14px;height:14px}
.rec{border-radius:18px;padding:14px 16px;margin:10px 0;background:var(--warn1);color:var(--warntext)}
.rec.l2{background:var(--warn2)}
.rec b{font:800 18px "Bricolage Grotesque",Figtree,sans-serif;display:block;margin-bottom:4px}
.rec p{margin:2px 0}
.rec ul{margin:6px 0 0;padding-left:18px}
.info{border-radius:16px;padding:12px 14px;background:var(--card2);margin:10px 0;font-size:14.5px}
/* exercício */
.ex{scroll-margin-top:110px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,var(--line));border-radius:18px;margin:10px 0;overflow:hidden}
.gb-glu{--gc:var(--g-glu)}.gb-qua{--gc:var(--g-qua)}.gb-pos{--gc:var(--g-pos)}.gb-cos{--gc:var(--g-cos)}.gb-omb{--gc:var(--g-omb)}.gb-bra{--gc:var(--g-bra)}.gb-pan{--gc:var(--g-pan)}.gb-abd{--gc:var(--g-abd)}
.exh{display:flex;align-items:center;gap:12px;padding:12px 12px 6px}
.fgt{width:60px;height:60px;flex:none;border-radius:16px;overflow:hidden;display:block}
.fgt svg{display:block}
.exm2{flex:1;text-align:left;min-width:0;min-height:60px}
.exn{font:700 17px/1.2 "Bricolage Grotesque",Figtree,sans-serif;display:block}
.exs{display:block;font:700 16px/1.25 Figtree,sans-serif;margin:4px 0 2px}
.exm{display:block;font-size:13.5px;color:var(--mute)}
.exd{display:flex;align-items:center;gap:6px;padding:0 14px 12px 14px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.on{background:var(--clay);border-color:var(--clay)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink)}
.badge.pr{background:var(--clay)}
.badge.up{background:var(--petrol);color:var(--cream)}
.exb{padding:6px 14px 14px;border-top:1px dashed var(--line)}
.note{font-size:14px;background:var(--card2);border-radius:12px;padding:9px 11px;margin:10px 0 6px}
.last{font-size:14px;margin:10px 0 6px}
.ldrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.ldrow .lab2{font-weight:700;min-width:52px}
.sl{display:flex;align-items:center;gap:4px;flex:1;max-width:240px}
.sl button{width:44px;height:48px;border-radius:12px;background:var(--card2);font-weight:800;font-size:22px;line-height:1}
.fld{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 8px;text-align:center;font-weight:600;font-size:18px;min-width:0}
textarea.fld{height:auto;padding:10px;text-align:left;font-weight:400;font-size:16px}
select.fld{text-align:left;padding:0 10px;font-size:16px}
.sdots{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sd{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;position:relative;background:var(--bg)}
.sd b{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--mute)}
.sd svg{position:absolute;width:26px;height:26px;opacity:0}
.sd.on{background:var(--clay);border-color:var(--clay)}
.sd.on b{opacity:0}
.sd.on svg{opacity:1;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lab{font-size:13px;font-weight:600;color:var(--mute);display:block;margin:10px 0 4px}
.cnt{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.cnt button{width:60px;height:60px;border-radius:18px;background:var(--card2);font:800 30px "Bricolage Grotesque",sans-serif}
.cnt b{font:800 64px "Bricolage Grotesque",sans-serif;min-width:70px;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center}
.pill.on{background:var(--petrol);color:var(--cream);border-color:var(--petrol)}
.knee{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:8px 0}
.knee button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.knee button.on{background:var(--clay);border-color:var(--clay);color:var(--ink)}
.tm .big{font:800 36px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;text-align:left;margin:2px 0 0}
/* semana */
.wd{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:10px 0;width:100%;text-align:left}
.wd.today{border:2px solid var(--clay)}
.wdl{width:46px;text-align:center;flex:none}
.wdl b{display:block;font:800 20px "Bricolage Grotesque",sans-serif;text-transform:capitalize}
.wdl small{font-size:13px}
.wdc{flex:1;min-width:0}
.wdt{font-weight:700}
.wd .chip{background:var(--card2);color:var(--text)}
.wd .chip.fut{background:var(--clay);color:var(--ink)}
.wd .chip.night{background:var(--sand);color:var(--ink)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--clay);display:grid;place-items:center;flex:none}
.tick svg{width:14px;height:14px;color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font:800 24px "Bricolage Grotesque",sans-serif}
.stat small{font-size:12px}
.vol{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.g-glu{background:var(--g-glu)}.g-qua{background:var(--g-qua)}.g-pos{background:var(--g-pos)}.g-cos{background:var(--g-cos)}.g-omb{background:var(--g-omb)}.g-bra{background:var(--g-bra)}.g-pan{background:var(--g-pan)}.g-abd{background:var(--g-abd)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:12px}
nav#nav svg{width:24px;height:24px}
nav#nav button.on{color:var(--text)}
nav#nav button.on svg{color:var(--clay)}
nav#nav button.on span{border-bottom:2px solid var(--clay)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;display:none}
#timer.on{display:block}
.tb{max-width:536px;margin:0 auto;background:var(--petrol);color:var(--cream);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.tb .tt{min-width:84px}
.tb small{color:var(--sand);display:block;font-size:12px}
.tb b{font:800 28px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.tb .tbar{flex:1;height:8px;border-radius:4px;background:rgba(252,233,210,.2);overflow:hidden}
.tb .tbar i{display:block;height:100%;background:var(--clay);width:100%}
.tb button{min-height:40px;padding:0 12px;border-radius:12px;background:rgba(252,233,210,.16);font-weight:700;font-size:14px}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 200px);overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
#sheet h2{font-size:26px;margin-bottom:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;gap:6px}
.hub svg{width:26px;height:26px;color:var(--clay)}
.hub b{font:800 18px "Bricolage Grotesque",sans-serif}
.hub small{font-size:13px;line-height:1.3}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:0 0 8px;min-height:40px}
.back svg{width:18px;height:18px}
h2.pg{font-size:34px;margin:4px 0 8px}
.mob{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px dashed var(--line)}.mob .fgt{margin-top:2px}
.reg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);display:inline-block;margin-bottom:4px}
.ring{display:block;margin:6px auto}
.ring text{font:800 38px "Bricolage Grotesque",sans-serif;fill:var(--text)}
.ab{display:flex;gap:10px;align-items:center;margin:12px 0}
.ab .fgt{width:52px;height:52px;border-radius:14px}
.chk{width:38px;height:38px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk svg{width:20px;height:20px;opacity:.25}
.chk.on{background:var(--clay);border-color:var(--clay)}
.chk.on svg{opacity:1;color:var(--ink)}
.sg .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink);display:inline-block;margin-bottom:6px}
.sg .tag.k{background:var(--clay)}
.sg h3{font-size:19px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mute);font:600 10px Figtree,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== seis ajustes visuais ===== */
.ex{border-left:1px solid var(--line)}
.ex.cur{border-left-color:var(--clay)}
.exm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px}
.rst{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--text);flex:none}
.rst svg{width:18px;height:18px;color:var(--clay)}
.rstl{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-weight:700;font-size:15.5px}
.rstl svg{width:26px;height:26px;color:var(--clay);flex:none}
.exm .mt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc,var(--line));margin-right:7px;vertical-align:1px}
.exb{border-top:0;padding:4px 16px 16px}
.exd{padding:0 16px 12px 16px;align-items:center}
.exd .lastl{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.tipsb{background:var(--card2);border-radius:16px;padding:2px 14px;margin:6px 0 10px}
.tipsh{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px;text-align:left}
.tipsb ul{margin:0 0 12px;padding-left:18px;font-size:15px}
.tipsb li{margin:3px 0}
.blk2{background:color-mix(in srgb,var(--card2) 60%,transparent);border-radius:18px;padding:12px 14px;margin:10px 0}
.blk2 .ldrow{margin:0 0 8px}
.blk2 .sdots{margin:0;gap:10px}
.blk2 .sd{width:52px;height:52px}
.hero .chip.night,.wd .chip.night,.card .chip.night{background:rgba(252,233,210,.14);color:inherit;border:1px solid rgba(252,233,210,.22)}
.wd .chip.night,.card .chip.night{background:var(--card2);border-color:transparent;color:var(--text)}
.card{border-color:rgba(67,30,64,.08)}
.card,.rec,.info{margin:14px 0}
.stat div{border-color:transparent}
.wd{border-color:transparent}
.pill.sm{min-height:38px;padding:0 12px;font-size:14px}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.rcrd{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rcrd:first-of-type{border-top:0}
.evg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.evc{background:var(--card);border:1px solid transparent;border-radius:22px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.evc small{font-size:13px}
.evc b{font:800 30px/1.1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em}
.evc b span{font-size:15px;font-weight:600;color:var(--mute)}
.evc .dlt{font-weight:800;color:var(--clay);font-size:15px;margin-top:2px}
.xs{position:sticky;top:6px;display:grid;place-items:center;margin:-8px 0 -40px auto;width:42px;height:42px;border-radius:50%;background:var(--card2);color:var(--text);font-size:26px;line-height:1;z-index:3;box-shadow:var(--sh)}
#sheet h2{padding-right:48px}

html:root,html:root[data-theme="dark"],html:root:not([data-theme="light"]){
 --petrol:#431E40;--clay:#EF512C;--sand:#FD9651;--cream:#FCE9D2;--ink:#150F14;

 --hero:#431E40;--herotext:#FCE9D2;--herosub:#FD9651;--btn:#EF512C;--btntext:#150F14;

 --warn1:#FD9651;--warn2:#EF512C;--warntext:#150F14;color-scheme:dark}
html:root body{background:radial-gradient(110% 50% at 105% -8%,rgba(253,150,81,.10),transparent 60%),radial-gradient(90% 45% at -12% 6%,rgba(168,50,140,.20),transparent 58%),#150F14}
nav#nav{background:#1B131A}

.hero::before{background:radial-gradient(circle,rgba(226,39,151,.32),transparent 66%)}.hero::after{background:radial-gradient(circle,rgba(253,150,81,.16),transparent 66%)}

html:root,html:root[data-theme="dark"],html:root:not([data-theme="light"]){
 --bg:#120C11;--card:#1C141B;--card2:#261B25;--line:rgba(252,233,210,.07);--hair:rgba(252,233,210,.07);--tone:rgba(252,233,210,.07);--tone2:rgba(252,233,210,.11);
 --mute:#BFA9B8;--sh:none;--sh2:none}
html:root body{background:radial-gradient(120% 40% at 100% -6%,rgba(226,39,151,.13),transparent 60%),radial-gradient(90% 34% at -10% 0%,rgba(150,48,128,.15),transparent 62%),var(--bg);-webkit-font-smoothing:antialiased}

.card{padding:18px;margin:12px 0}

function reportData(start,end){

  const byEx={};
  days.forEach(d=>{const l=L(d);if(l.fin){R.fin++;if(l.eff)R.eff[l.eff]++}if(l.start&&l.end)R.mins.push((l.end-l.start)/60000);if(l.fut)R.fut++;R.bike+=l.bike||0;R.abs+=absDone(d);R.kcal+=num(l.kcal)||0;R.futKcal+=num(l.futCal)||0;
    if(l.cal){if(l.cal.a)R.calA.push(l.cal.a);if(l.cal.t)R.calT.push(l.cal.t)}if(l.knee!=null)R.knee.push(l.knee);
    Object.keys(l.ex||{}).forEach(id=>{const e=l.ex[id];const nd=nDone(e);if(!nd||e.sub)return;R.sets+=nd;const ld=entLoad(e);(byEx[id]=byEx[id]||{n:e.n,s:[]}).s.push({d,ld});if(e.pr||e.sets.some(s=>s.pr))R.pr.push({d,n:e.n});if(e.obs)R.obs.push({d,n:e.n,t:e.obs});if(e.pain)R.pain.push({d,n:e.n})})});
  Object.keys(byEx).forEach(id=>{const b=byEx[id],s=b.s.filter(x=>x.ld);if(!s.length)return;let prev=null;Object.keys(S.logs).sort().forEach(k=>{if(k<start){const e=S.logs[k].ex&&S.logs[k].ex[id];if(e&&!e.sub&&nDone(e)&&entLoad(e))prev=entLoad(e)}});
    const a=prev!=null?prev:s[0].ld,z=s[s.length-1].ld;R.ex.push({n:b.n,a,z,pct:a?(z-a)/a*100:0,sess:b.s.length})});
  const am={};days.forEach(d=>actList(d).forEach(x=>{const r=am[x.label]||(am[x.label]={label:x.label,n:0,kcal:0,min:0,dias:0});r.dias++;r.n+=x.n||0;r.kcal+=num(x.kcal)||0;r.min+=num(x.min)||0}));R.acts=Object.values(am).sort((a,b)=>b.kcal-a.kcal);
  R.ex.sort((x,y)=>y.pct-x.pct);
  const ms=(S.core.evo||[]).filter(m=>m.d>=start&&m.d<=end&&["p","c","q","x"].some(k=>m[k]!=null)).sort((a,b)=>a.d<b.d?-1:1);if(ms.length){const pick=(k,f)=>{const r=ms.filter(m=>m[k]!=null);return r.length?r[f?0:r.length-1]:null};R.meas={a:{p:(pick("p",1)||{}).p,c:(pick("c",1)||{}).c,q:(pick("q",1)||{}).q,x:(pick("x",1)||{}).x},z:{p:(pick("p",0)||{}).p,c:(pick("c",0)||{}).c,q:(pick("q",0)||{}).q,x:(pick("x",0)||{}).x}}}
  return R}

    case"sleep":{regOpen=false;const l=L(cur,true);l.sleep=l.sleep===+D.n?null:+D.n;mod(cur);render();break}
    case"regOpen":regOpen=true;render();break;
    case"kneeOpen":kneeOpen=true;render();break;
    case"kneeSet":{kneeOpen=false;const l=L(cur,true);l.knee=l.knee===+D.n?null:+D.n;mod(cur);render();break}
    case"absType":{const l=L(cur,true);l.absT=D.t;mod(cur);render();break}
    case"absTgl":{const l=L(cur,true);l.abs=l.abs||{};l.abs[D.b]=!l.abs[D.b];mod(cur);render();break}
    case"plank":startTimer(+D.s,"Prancha");break;
    case"absEdit":{const k=absType(cur)==="b"?"big":"small";openSheet('<h2>Editar circuito</h2><p class="mute">'+(k==="big"?"Sessão completa":"Sessão curta")+'. Nome, repetições e carga (kg) de cada bloco. Apague o nome para remover.</p>'+S.core.abs[k].map((x,i)=>'<div class="row" style="margin:8px 0"><input class="fld" style="text-align:left;flex:3" data-sf="n'+i+'" value="'+esc(x.n)+'" aria-label="Nome"><input class="fld" style="flex:1" inputmode="numeric" data-sf="r'+i+'" value="'+x.r+'" aria-label="Repetições"><input class="fld" style="flex:1" inputmode="decimal" data-sf="l'+i+'" value="'+(x.l!=null?nf(x.l):"")+'" placeholder="kg" aria-label="Carga"></div>').join("")+'<div class="acts"><button class="btn" data-a="absSave" data-k="'+k+'">Salvar</button><button class="btn ghost" data-a="absAdd" data-k="'+k+'">Adicionar bloco</button></div>');break}
    case"absSave":{const f=sf(),arr=S.core.abs[D.k];arr.forEach((x,i)=>{x.n=(f["n"+i]||"").trim()||x.n;x.r=Math.max(1,parseInt(f["r"+i])||x.r);const lv=num(f["l"+i]);if(lv!=null)x.l=lv;else if(x.l!=null&&f["l"+i]==="")x.l=null});S.core.abs[D.k]=arr.filter((x,i)=>(f["n"+i]||"").trim()!=="");modCore();closeSheet();render();break}
    case"absAdd":{S.core.abs[D.k].push({id:"x"+Date.now(),n:"Novo exercício",r:15});modCore();closeSheet();render();break}
    case"mobTgl":{const l=L(cur,true);l.mob=l.mob||{};l.mob[D.m]=!l.mob[D.m];mod(cur);render();break}
    case"mobTimer":{const x=MOB.concat(WU).find(q=>q.id===D.m);startTimer(x.t,x.r);break}
    case"calRange":calRange=D.r;render();break;
    case"suggFlag":{const st=S.core.sugg[D.s]||(S.core.sugg[D.s]={});st.flag=!st.flag;modCore();render();break}
    case"suggDo":{const s=SUGG.find(q=>q.id===D.s),dest=PLAN()[s.day];if(!dest){toast("Esse dia não tem treino na ficha atual");break}const tgt=s.rep&&dest.items.find(x=>x.id===s.rep);openSheet('<h2>Incorporar à ficha?</h2><p><b>'+esc(s.ex.n)+'</b> entra na '+DOW[s.day].toLowerCase()+(tgt?', no lugar de <b>'+esc(tgt.n)+'</b>':', no fim do treino')+'.</p><p class="mute">A ficha original continua guardada e pode ser restaurada em Ajustes.</p><div class="acts"><button class="btn" data-a="suggOk" data-s="'+s.id+'">Incorporar</button><button class="btn ghost" data-a="closeSheet">Cancelar</button></div>');break}
    case"suggOk":{const s=SUGG.find(q=>q.id===D.s),dest=PLAN()[s.day];if(!dest)break;const ne=mk("u"+s.id+Date.now(),s.ex.n,s.ex.s,s.ex.r,s.ex.l,s.g,{inc:2.5}),i=s.rep?dest.items.findIndex(x=>x.id===s.rep):-1;if(i>=0)dest.items[i]=ne;else dest.items.push(ne);(S.core.sugg[s.id]=S.core.sugg[s.id]||{}).done=true;modCore();closeSheet();toast("Incorporada à ficha");render();break}
    case"origPlan":{let h='<h2>Ficha original</h2>';for(const k in PLAN0){const p=PLAN0[k];h+='<h3 style="margin-top:12px">'+DOW[k]+" · "+esc(p.nome)+'</h3><small>'+esc(p.foco)+'</small><ol style="margin:6px 0;padding-left:20px">'+p.items.map(x=>"<li>"+esc(x.n)+" "+x.s+"x"+x.r+(x.l!=null?" · "+nf(x.l)+" "+esc(x.lab):"")+"</li>").join("")+"</ol>"}openSheet(h);break}
    case"setRest":S.core.set.rest=+D.v;modCore();render();break;
    case"setTheme":S.core.set.theme=D.v;modCore();applyTheme();render();break;
    case"setWake":S.core.set.wake=!S.core.set.wake;modCore();if(S.core.set.wake)wake();else{try{wl&&wl.release()}catch(_){}}render();break;
    case"setCardio":S.core.set.cardio[D.v]=!S.core.set.cardio[D.v];modCore();render();break;
    case"startDeload":S.core.cycle.deload=todayStr();modCore();toast("Semana de descarga iniciada");render();break;
    case"resetCycle":S.core.cycle={start:todayStr(),deload:null};modCore();toast("Ciclo reiniciado");render();break;
    case"repGen":{const ok=(S.core.evo||[]).some(m=>m.d>=addDays(todayStr(),-7)&&["p","c","q","x","gp"].some(k=>m[k]!=null))||(S.core.aval||[]).some(a=>a.d>=addDays(todayStr(),-7));
      if(!ok&&!D.force){openSheet('<h2>Antes de gerar</h2><p>Você não registrou peso ou medidas nos últimos 7 dias. Com elas, o relatório mostra o comparativo do período.</p><div class="acts"><button class="btn blk" data-a="repMeas">Registrar medidas agora</button><button class="btn blk ghost" data-a="repGen" data-force="1">Gerar assim mesmo</button></div>');break}
      closeSheet();genReport();break}
    case"repMeas":closeSheet();avalSheet({d:todayStr(),t:"Medidas do relatório"});break;
    case"repSnooze":S.core.rep.snooze=todayStr();modCore();render();break;
    case"export":doExport(false);break;
    case"shareBk":doExport(true);break;
    case"bkLater":S.core.bkSnooze=addDays(todayStr(),3);modCore();render();break;
    case"arcLater":S.core.arcSnooze=addDays(todayStr(),7);modCore();render();break;
    case"arcExp":{const m=D.m;saveFiles(archiveFiles(m)).then(ok=>{if(ok){S.core.mExp=S.core.mExp||{};S.core.mExp[m]=todayStr();modCore();toast("Arquivo de "+monthName(m)+" gerado");render()}});break}
    case"arcAsk":{const m=D.m;openSheet('<h2>Compactar '+monthName(m)+'?</h2><p>Você guardou o arquivo deste mês no notebook?</p><p class="mute" style="font-size:13.5px">O app vai manter as cargas, as séries feitas, os recordes e os números da Evolução, e apagar o detalhe de cada série e as observações. Dá para desfazer logo depois, ou restaurar o mês importando o arquivo.</p><div class="acts"><button class="btn blk" data-a="arcDo" data-m="'+m+'">Sim, compactar</button><button class="btn blk ghost" data-a="closeSheet">Ainda não</button></div>');break}
    case"arcDo":{const n=compactMonth(D.m);closeSheet();render();toast("Mês compactado ("+n+" registros)");break}
    case"undoImport":{try{const x=JSON.parse(localStorage.getItem(KEY+".prev")||"null");if(x&&x.core&&x.logs){S=x;ensure();S.ts={core:Date.now()};for(const k in S.logs)S.ts["m-"+k.slice(0,7)]=Date.now();dirtyCore=true;Object.keys(S.logs).forEach(k=>dirtyM.add(k.slice(0,7)));localStorage.removeItem(KEY+".prev");persist();applyTheme();render();toast("Importação desfeita")}}catch(e){toast("Não foi possível desfazer")}break}
    case"copyJson":copyText(exportJson());S.core.lastBackup=todayStr();modCore();toast("Dados copiados");render();break;
    case"importSheet":openSheet('<h2>Importar dados</h2><p class="mute">Escolha o arquivo de backup ou cole o conteúdo.</p><p class="mute" style="font-size:13.5px"><b>Só a evolução</b> acrescenta o peso, as medidas e as avaliações do arquivo e mantém os seus treinos. <b>Importar tudo</b> substitui todos os dados atuais.</p><input type="file" accept=".json,application/json" id="impf" class="fld" style="height:auto;padding:10px"><label class="lab" for="impt">Ou cole aqui</label><textarea class="fld" id="impt" rows="4"></textarea><div class="acts" style="margin-top:12px"><button class="btn" data-a="importEvo">Só a evolução</button><button class="btn ghost" data-a="importGo">Importar tudo</button><button class="btn ghost" data-a="closeSheet">Cancelar</button></div>');break;
    case"importEvo":{const f=$("#impf").files[0];if(f){const r=new FileReader();r.onload=()=>mergeEvo(String(r.result));r.readAsText(f)}else mergeEvo($("#impt").value);break}
    case"importGo":{const f=$("#impf").files[0];if(f){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}else doImport($("#impt").value);break}
    case"resetPlan":openSheet('<h2>Restaurar ficha original?</h2><p>As cargas e mudanças na ficha voltam ao padrão. O histórico de treinos é mantido.</p><div class="acts"><button class="btn" data-a="resetOk">Restaurar</button><button class="btn ghost" data-a="closeSheet">Cancelar</button></div>');break;
    case"resetOk":S.core.plan=clone(PLAN0);S.core.sugg={};modCore();closeSheet();render();break;
    case"summary":{const t=weeklyText();openSheet('<h2>Resumo para o personal</h2><textarea class="fld" id="sumt" rows="12" readonly>'+esc(t)+'</textarea><div class="acts" style="margin-top:12px"><button class="btn" data-a="copySum">Copiar texto</button><button class="btn ghost" data-a="closeSheet">Fechar</button></div>');break}
    case"copySum":copyText($("#sumt").value);toast("Texto copiado");break;
    case"tadd":if(T){T.end+=15000;T.total+=15;tick()}break;
    case"tskip":stopTimer();break;
    case"closeSheet":closeSheet();render();break;
  }
});
window.addEventListener("scroll",()=>{const u=document.getElementById("up");if(u)u.classList.toggle("on",(window.scrollY||document.documentElement.scrollTop||0)>450)},{passive:true});
document.addEventListener("input",e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==="ld"){const ex=findEx(el.dataset.ex);ex.l=num(el.value);modCore();const en=L(cur).ex&&L(cur).ex[ex.id];if(en&&nDone(en)){en.load=ex.l;mod(cur)}refreshMeta(ex)}
  else if(k==="obs"){const ex=findEx(el.dataset.ex),en=exEntry(cur,ex);en.obs=el.value;mod(cur)}
  else if(k==="note"){S.core.notes[el.dataset.ex]=el.value;modCore()}
  else if(k==="cal"){const l=L(cur,true);l.cal=l.cal||{};l.cal[el.dataset.k]=num(el.value);mod(cur)}
  else if(k==="actF"){const key=el.dataset.k;actForm[key]=key==="name"?el.value:num(el.value)}
  else if(k==="bikeKcal"){const l=L(cur,true);l.bikeKcal=num(el.value);mod(cur)}
  else if(k==="kcal"){const l=L(cur,true);l.kcal=num(el.value);mod(cur)}
  else if(k==="futCal"){const l=L(cur,true);l.futCal=num(el.value);mod(cur)}
  else if(k==="meas"){let m=S.core.meas.find(x=>x.d===cur);if(!m){m={d:cur};S.core.meas.push(m)}m[el.dataset.k]=num(el.value);modCore()}
});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.in==="evoSel"){evoEx=el.value;render()}});

/* ---------- início ---------- */
setTimeout(checkRem,1500);
loadLocal();askPersist();FRESH0=!(S.ts.core>0);if(migrated){modCore();migrated=false}applyTheme();closeWeeks();render();wake();initCloud();
})();
</script>
