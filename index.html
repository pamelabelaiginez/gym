<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gym</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A0F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<script src="jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --petrol:#431E40; --clay:#EA6244; --sand:#F4876B; --cream:#FCE9D2; --ink:#150F14;
  --bg:#FCE9D2; --card:#FFF1DF; --card2:#F8DDBF; --text:#150F14; --mute:#D1BDCC; --line:rgba(67,30,64,.18);
  --hero:#431E40; --herotext:#FCE9D2; --herosub:#F4876B;
  --btn:#EA6244; --btntext:#150F14;
  --g-glu:#EA6244; --g-qua:#F4876B; --g-pos:#EA6244; --g-cos:#431E40; --g-omb:#E39BC7; --g-bra:#F8A38C; --g-pan:#C7ABA0; --g-abd:#150F14;
  --warn1:#F4876B; --warn2:#EA6244; --warntext:#150F14;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150F14; --card:#20181F; --card2:#2D222C; --text:#FCE9D2; --mute:#D1BDCC; --line:rgba(252,233,210,.16);
    --hero:#431E40; --g-cos:#F3C8F3; --g-abd:#FCE9D2; --g-pan:#C7ABA0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150F14; --card:#20181F; --card2:#2D222C; --text:#FCE9D2; --mute:#D1BDCC; --line:rgba(252,233,210,.16);
  --hero:#431E40; --g-cos:#F3C8F3; --g-abd:#FCE9D2; --g-pan:#C7ABA0; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.015em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 190px}
small,.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h3{font-size:20px;margin-bottom:4px}
.card p{margin:4px 0 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--btn);color:var(--btntext);font-weight:700}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);font-weight:600}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.blk{width:100%}
.btn.dark{background:var(--petrol);color:var(--cream)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.dn{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.dnt{flex:1;text-align:center}
.dnt small{display:block;font-size:12px}
.dnt b{font:800 19px "Bricolage Grotesque",Figtree,sans-serif;text-transform:capitalize}
.phrase{text-align:center;font-style:italic;color:var(--mute);margin:0 8px 12px;font-size:15px}
.toToday{display:block;margin:-2px auto 8px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:underline}
.hero{background:var(--hero);color:var(--herotext);border-radius:24px;padding:20px 18px 16px;margin:6px 0 12px}
.hero .k{font-size:15px;color:var(--herosub);font-weight:600}
.hero h1{font-size:46px;font-weight:800;margin:4px 0 2px}
.hero p{margin:0;color:var(--herotext);opacity:.9}
.segs{display:flex;gap:3px;margin:16px 0 8px;flex-wrap:wrap}
.segs i{height:8px;border-radius:4px;background:rgba(252,233,210,.22);flex:1 1 10px;min-width:8px;max-width:28px}
.segs i.on{background:var(--clay)}
.hm{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.hm b{font:800 26px "Bricolage Grotesque",Figtree,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(252,233,210,.14);color:var(--herotext)}
.card .chip{background:var(--card2);color:var(--text)}
.chip.fut,.card .chip.fut{background:var(--clay);color:var(--ink)}
.chip.night,.card .chip.night{background:var(--sand);color:var(--ink)}
.card .chip.no,.wd .chip.no{background:transparent;border:1px solid var(--line);color:var(--mute)}
.card .chip.fin,.wd .chip.fin{background:var(--petrol);color:var(--cream)}
.wkp{display:flex;justify-content:space-between;margin:2px 0 12px}.wkd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:40px}.wkc{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}.wkc svg{width:18px;height:18px;color:var(--ink)}.wkd.on .wkc{background:var(--clay);border-color:var(--clay)}.wkd.td .wkc{border-color:var(--clay)}.wkd small{font-weight:600}.wkd.cu small{font-weight:800;color:var(--text)}.hm .gotr{min-height:40px;padding:0 14px;border-radius:999px;background:var(--clay);color:var(--ink);font-weight:700;font-size:14px}.exinfo{font-size:13.5px;margin-top:10px;color:var(--herosub)}
.ckc{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg)}.ckc svg{width:20px;height:20px;opacity:0}.ckc.on{background:var(--clay);border-color:var(--clay)}.ckc.on svg{opacity:1;color:var(--ink)}
.ex.cur{border-color:var(--clay)}.ex.fin{opacity:.9}.exr{display:flex;align-items:center;gap:12px;padding:8px 12px}.exrb{text-align:left;flex:1;min-width:0}.exrb b{display:block;font:700 16px/1.2 "Bricolage Grotesque",Figtree,sans-serif}.exrb small{display:block}
.ico{display:inline-flex;vertical-align:-4px;margin-right:6px;color:var(--clay)}.ico svg{width:20px;height:20px}.ci{display:inline-flex}.ci svg{width:14px;height:14px}
.rec{border-radius:18px;padding:14px 16px;margin:10px 0;background:var(--warn1);color:var(--warntext)}
.rec.l2{background:var(--warn2)}
.rec b{font:800 18px "Bricolage Grotesque",Figtree,sans-serif;display:block;margin-bottom:4px}
.rec p{margin:2px 0}
.rec ul{margin:6px 0 0;padding-left:18px}
.info{border-radius:16px;padding:12px 14px;background:var(--card2);margin:10px 0;font-size:14.5px}
/* exercício */
.ex{scroll-margin-top:110px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gc,var(--line));border-radius:18px;margin:10px 0;overflow:hidden}
.gb-glu{--gc:var(--g-glu)}.gb-qua{--gc:var(--g-qua)}.gb-pos{--gc:var(--g-pos)}.gb-cos{--gc:var(--g-cos)}.gb-omb{--gc:var(--g-omb)}.gb-bra{--gc:var(--g-bra)}.gb-pan{--gc:var(--g-pan)}.gb-abd{--gc:var(--g-abd)}
.exh{display:flex;align-items:center;gap:12px;padding:12px 12px 6px}
.fgt{width:60px;height:60px;flex:none;border-radius:16px;overflow:hidden;display:block}
.fgt svg{display:block}
.exm2{flex:1;text-align:left;min-width:0;min-height:60px}
.exn{font:700 17px/1.2 "Bricolage Grotesque",Figtree,sans-serif;display:block}
.exs{display:block;font:700 16px/1.25 Figtree,sans-serif;margin:4px 0 2px}
.exm{display:block;font-size:13.5px;color:var(--mute)}
.exd{display:flex;align-items:center;gap:6px;padding:0 14px 12px 14px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.on{background:var(--clay);border-color:var(--clay)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink)}
.badge.pr{background:var(--clay)}
.badge.up{background:var(--petrol);color:var(--cream)}
.exb{padding:6px 14px 14px;border-top:1px dashed var(--line)}
.note{font-size:14px;background:var(--card2);border-radius:12px;padding:9px 11px;margin:10px 0 6px}
.last{font-size:14px;margin:10px 0 6px}
.ldrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.ldrow .lab2{font-weight:700;min-width:52px}
.sl{display:flex;align-items:center;gap:4px;flex:1;max-width:240px}
.sl button{width:44px;height:48px;border-radius:12px;background:var(--card2);font-weight:800;font-size:22px;line-height:1}
.fld{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 8px;text-align:center;font-weight:600;font-size:18px;min-width:0}
textarea.fld{height:auto;padding:10px;text-align:left;font-weight:400;font-size:16px}
select.fld{text-align:left;padding:0 10px;font-size:16px}
.sdots{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sd{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;position:relative;background:var(--bg)}
.sd b{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--mute)}
.sd svg{position:absolute;width:26px;height:26px;opacity:0}
.sd.on{background:var(--clay);border-color:var(--clay)}
.sd.on b{opacity:0}
.sd.on svg{opacity:1;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lab{font-size:13px;font-weight:600;color:var(--mute);display:block;margin:10px 0 4px}
.cnt{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.cnt button{width:60px;height:60px;border-radius:18px;background:var(--card2);font:800 30px "Bricolage Grotesque",sans-serif}
.cnt b{font:800 64px "Bricolage Grotesque",sans-serif;min-width:70px;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center}
.pill.on{background:var(--petrol);color:var(--cream);border-color:var(--petrol)}
.knee{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:8px 0}
.knee button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.knee button.on{background:var(--clay);border-color:var(--clay);color:var(--ink)}
.tm .big{font:800 36px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;text-align:left;margin:2px 0 0}
/* semana */
.wd{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin:10px 0;width:100%;text-align:left}
.wd.today{border:2px solid var(--clay)}
.wdl{width:46px;text-align:center;flex:none}
.wdl b{display:block;font:800 20px "Bricolage Grotesque",sans-serif;text-transform:capitalize}
.wdl small{font-size:13px}
.wdc{flex:1;min-width:0}
.wdt{font-weight:700}
.wd .chip{background:var(--card2);color:var(--text)}
.wd .chip.fut{background:var(--clay);color:var(--ink)}
.wd .chip.night{background:var(--sand);color:var(--ink)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--clay);display:grid;place-items:center;flex:none}
.tick svg{width:14px;height:14px;color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font:800 24px "Bricolage Grotesque",sans-serif}
.stat small{font-size:12px}
.vol{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.g-glu{background:var(--g-glu)}.g-qua{background:var(--g-qua)}.g-pos{background:var(--g-pos)}.g-cos{background:var(--g-cos)}.g-omb{background:var(--g-omb)}.g-bra{background:var(--g-bra)}.g-pan{background:var(--g-pan)}.g-abd{background:var(--g-abd)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:12px}
nav#nav svg{width:24px;height:24px}
nav#nav button.on{color:var(--text)}
nav#nav button.on svg{color:var(--clay)}
nav#nav button.on span{border-bottom:2px solid var(--clay)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;display:none}
#timer.on{display:block}
.tb{max-width:536px;margin:0 auto;background:var(--petrol);color:var(--cream);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.tb .tt{min-width:84px}
.tb small{color:var(--sand);display:block;font-size:12px}
.tb b{font:800 28px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.tb .tbar{flex:1;height:8px;border-radius:4px;background:rgba(252,233,210,.2);overflow:hidden}
.tb .tbar i{display:block;height:100%;background:var(--clay);width:100%}
.tb button{min-height:40px;padding:0 12px;border-radius:12px;background:rgba(252,233,210,.16);font-weight:700;font-size:14px}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 200px);overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
#sheet h2{font-size:26px;margin-bottom:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;gap:6px}
.hub svg{width:26px;height:26px;color:var(--clay)}
.hub b{font:800 18px "Bricolage Grotesque",sans-serif}
.hub small{font-size:13px;line-height:1.3}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin:0 0 8px;min-height:40px}
.back svg{width:18px;height:18px}
h2.pg{font-size:34px;margin:4px 0 8px}
.mob{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px dashed var(--line)}.mob .fgt{margin-top:2px}
.reg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);display:inline-block;margin-bottom:4px}
.ring{display:block;margin:6px auto}
.ring text{font:800 38px "Bricolage Grotesque",sans-serif;fill:var(--text)}
.ab{display:flex;gap:10px;align-items:center;margin:12px 0}
.ab .fgt{width:52px;height:52px;border-radius:14px}
.chk{width:38px;height:38px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk svg{width:20px;height:20px;opacity:.25}
.chk.on{background:var(--clay);border-color:var(--clay)}
.chk.on svg{opacity:1;color:var(--ink)}
.sg .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink);display:inline-block;margin-bottom:6px}
.sg .tag.k{background:var(--clay)}
.sg h3{font-size:19px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mute);font:600 10px Figtree,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== seis ajustes visuais ===== */
.ex{border-left:1px solid var(--line)}
.ex.cur{border-left-color:var(--clay)}
.exm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px}
.rst{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--text);flex:none}
.rst svg{width:18px;height:18px;color:var(--clay)}
.rstl{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-weight:700;font-size:15.5px}
.rstl svg{width:26px;height:26px;color:var(--clay);flex:none}
.exm .mt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc,var(--line));margin-right:7px;vertical-align:1px}
.exb{border-top:0;padding:4px 16px 16px}
.exd{padding:0 16px 12px 16px;align-items:center}
.exd .lastl{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.tipsb{background:var(--card2);border-radius:16px;padding:2px 14px;margin:6px 0 10px}
.tipsh{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px;text-align:left}
.tipsb ul{margin:0 0 12px;padding-left:18px;font-size:15px}
.tipsb li{margin:3px 0}
.blk2{background:color-mix(in srgb,var(--card2) 60%,transparent);border-radius:18px;padding:12px 14px;margin:10px 0}
.blk2 .ldrow{margin:0 0 8px}
.blk2 .sdots{margin:0;gap:10px}
.blk2 .sd{width:52px;height:52px}
.hero .chip.night,.wd .chip.night,.card .chip.night{background:rgba(252,233,210,.14);color:inherit;border:1px solid rgba(252,233,210,.22)}
.wd .chip.night,.card .chip.night{background:var(--card2);border-color:transparent;color:var(--text)}
.card{border-color:rgba(67,30,64,.08)}
.card,.rec,.info{margin:14px 0}
.stat div{border-color:transparent}
.wd{border-color:transparent}
.pill.sm{min-height:38px;padding:0 12px;font-size:14px}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.rcrd{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rcrd:first-of-type{border-top:0}
.evg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.evc{background:var(--card);border:1px solid transparent;border-radius:22px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.evc small{font-size:13px}
.evc b{font:800 30px/1.1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em}
.evc b span{font-size:15px;font-weight:600;color:var(--mute)}
.evc .dlt{font-weight:800;color:var(--clay);font-size:15px;margin-top:2px}
.xs{position:sticky;top:6px;display:grid;place-items:center;margin:-8px 0 -40px auto;width:42px;height:42px;border-radius:50%;background:var(--card2);color:var(--text);font-size:26px;line-height:1;z-index:3;box-shadow:var(--sh)}
#sheet h2{padding-right:48px}

 --petrol:#431E40;--clay:#EA6244;--sand:#F4876B;--cream:#FCE9D2;--ink:#150F14;

.hero::before{background:radial-gradient(circle,rgba(226,39,151,.32),transparent 66%)}.hero::after{background:radial-gradient(circle,rgba(244,135,107,.16),transparent 66%)}

 --bg:#120C11;--card:#1C141B;--card2:#261B25;--line:rgba(252,233,210,.07);--hair:rgba(252,233,210,.07);--tone:rgba(252,233,210,.07);--tone2:rgba(252,233,210,.11);
 --mute:#BFA9B8;--sh:none;--sh2:none}

.exb{padding:2px 16px 14px}
.tipsb{background:none;border-top:1px solid var(--hair);border-radius:0;padding:0;margin:8px 0 6px}
.tipsh{min-height:42px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tipsb ul{font-size:14px;color:#D9C8D2;margin:0 0 10px;padding-left:18px}
.rstl{font-size:13px;font-weight:600;color:var(--mute)}.rstl svg{width:20px;height:20px;color:var(--mute)}
.fld{border:0!important;background:var(--tone2)}
.sd{border:0!important;background:var(--tone)}
.sd.on{background:var(--clay)}
.acts{gap:2px 6px}
.exr{padding:10px 14px;gap:12px}
.exrb b{font-size:15.5px}
/* --- Semana, Mês, Mais: mesmo sistema --- */
.wd{padding:14px 16px}
.wd.today{border:0!important;background:var(--card2);box-shadow:inset 3px 0 0 var(--clay)}
.cd{border:0!important;background:var(--tone)}
.cd.td{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--clay)}
.stat div{background:var(--card)}
.hub button{padding:16px}
.knee button{border:0!important;background:var(--tone)}
/* --- navegação inferior: barra contínua, translúcida, sem pílula --- */
nav#nav{left:0!important;right:0!important;bottom:0!important;margin:0!important;border-radius:0!important;border:0!important;border-top:1px solid var(--hair)!important;background:rgba(18,12,17,.84)!important;-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);box-shadow:none!important;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px)!important}
nav#nav button{min-height:50px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--mute);background:transparent!important}
nav#nav button.on{color:var(--text)}
nav#nav button.on svg{color:var(--navon)}
nav#nav button.on span{border-bottom:0!important}
nav#nav svg{width:22px;height:22px}

.chip.fut,.card .chip.fut,.wd .chip.fut{background:rgba(234,98,68,.18)!important;color:#F8A38C!important}
.cd{background:transparent!important}
.cd.fin{background:var(--clay)!important}

.ckc{position:relative}.ckc::after{content:"";position:absolute;inset:-8px}

/* --- série e carga em números; controles de carga discretos --- */
.exs{display:flex;align-items:baseline;gap:16px;font:inherit;margin:7px 0 0;color:var(--text)}
.exs .nb{display:inline-flex;align-items:baseline;gap:4px}
.exs .nb b{font:700 22px/1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.exs .nb u{text-decoration:none;font-size:13px;font-weight:600;color:var(--mute)}
.exs .ldn em{font-style:normal;font-size:13px;font-weight:600;color:var(--mute)}
.wkd small{font-size:10px;letter-spacing:.05em}
.ldrow{gap:8px}.ldrow .lab2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.sl{gap:6px}.sl button{width:32px;height:32px;border-radius:50%;background:var(--tone)!important;color:var(--mute);font-size:18px;line-height:1;box-shadow:none}
.sl .fld{height:34px;width:76px;font-size:15px;text-align:center}
/* --- linhas compactas: mobilidade, joelho --- */
.mobrow,.kneerow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px;margin:8px 0;border-radius:16px;background:var(--card);text-align:left;font-weight:600;font-size:14px;color:var(--text)}
.mobrow small,.kneerow small{margin-left:auto;color:var(--mute);font-weight:500;font-size:12.5px}
.mobrow i,.kneerow i{font-style:normal;color:var(--mute);margin-left:auto}.mobrow small+i{margin-left:8px}
.kneerow b{font-weight:700;color:var(--text)}.kneerow b+small{margin-left:auto}
.kneec{padding:14px 16px}
/* --- pulado e contagem de recolhimento --- */
.ex.skp{background:transparent;opacity:.8}.ex.skp::before{opacity:.35}
.skd{width:28px;height:28px;border-radius:50%;border:1.5px dashed rgba(252,233,210,.28);flex:none}
.cdl{height:2px;margin:0 16px 10px;background:var(--clay);opacity:.45;transform-origin:left;animation:cdl 20s linear forwards;border-radius:2px}
@keyframes cdl{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.cdl{animation:none}}
.info.pend{padding:12px 16px}.info.pend .acts{margin-top:4px}

.finrow{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 16px;margin:10px 0;border-radius:16px;background:rgba(234,98,68,.14);text-align:left;font-weight:700;font-size:14.5px;color:#F8A38C}
.finrow small{margin-left:auto;color:var(--mute);font-weight:500;font-size:12.5px}.finrow i{font-style:normal;color:var(--mute);margin-left:4px}
.wkd.part .wkc{background:rgba(234,98,68,.2);box-shadow:inset 0 0 0 2px rgba(234,98,68,.75)}
.wkd.part.td .wkc{box-shadow:inset 0 0 0 2px rgba(234,98,68,.75),0 0 0 2px var(--bg),0 0 0 3.5px var(--clay)}
.ex.swl,.ex.swr{transition:none}.ex.swl{background:rgba(252,233,210,.03)}.ex.swr{background:rgba(234,98,68,.12)}

/* --- opção escolhida: preenchimento sólido em Antique White (coral fica só para ação e conclusão) --- */
.pill.on,.knee button.on,.pills button.on,.chip.on{background:var(--cream)!important;color:#2B1428!important;box-shadow:none!important;font-weight:700}
.pill[data-a="pain"].on{background:rgba(234,98,68,.22)!important;color:#F8A38C!important}
.knee button{min-width:30px}

.dh{align-items:center}
.st{font-size:12px;font-weight:600;color:var(--mute)}.st-fin{color:#F8A38C}.st-part{color:#F8A38C}.st-no{color:#C9A58F}
.hojeP{margin-left:auto;min-height:30px;padding:0 13px;border-radius:999px;background:rgba(242,166,216,.16);color:#F2A6D8;font-size:12.5px;font-weight:700}

/* --- registro do dia, atividade extra, abdômen e joelho: presença para o que foi registrado --- */
.sec{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:22px 2px 8px}
.ri{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}.ri svg{width:19px;height:19px}
.r-en{background:rgba(244,135,107,.16);color:#F4876B}.r-sl{background:rgba(243,200,243,.14);color:#F3C8F3}.r-ex{background:rgba(234,98,68,.16);color:#F4876B}.r-ab{background:rgba(226,39,151,.16);color:#FF5CB9}.r-kn{background:rgba(255,178,122,.16);color:#F8A38C}
.rate{display:flex;align-items:center;gap:12px;padding:6px 0}.rate+.rate{border-top:1px solid var(--hair);margin-top:8px;padding-top:14px}
.rt{min-width:76px}.rt b{display:block;font-size:15px}.rt small{color:var(--mute);font-size:11.5px}
.seg{display:flex;gap:4px;flex:1}.seg .pill{flex:1;min-width:0;height:40px;min-height:40px;padding:0;justify-content:center;border-radius:12px}
.regrow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;font-weight:600;font-size:14px;color:var(--text)}
.regrow .ri{width:30px;height:30px;border-radius:10px}.regrow .ri svg{width:16px;height:16px}.regrow b{font-weight:700;margin-right:8px}.regrow small{margin-left:auto;color:var(--mute);font-weight:500}
.actc .row{align-items:center}
.acts2{margin-top:12px;display:grid;gap:8px}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:rgba(234,98,68,.12);text-align:left;color:var(--text)}
.ai{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(234,98,68,.22);color:#F4876B;flex:none}.ai svg{width:18px;height:18px}
.at b{display:block;font-size:15.5px;font-weight:700}.at small{color:#FFB09A;font-size:13px;font-weight:600}.act i{margin-left:auto;font-style:normal;color:var(--mute)}
.absc .row{align-items:center}.bn{font:800 30px/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--text);letter-spacing:-.02em}
.absc p.mute{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.pbar{height:6px;border-radius:3px;background:var(--tone);margin-top:14px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--clay),#FF5CB9)}
.kneerow .ri{width:30px;height:30px;border-radius:10px}.kneerow .ri svg{width:16px;height:16px}

/* --- Pink Lavender com mais presença: rótulos, progresso, navegação e destaques suaves --- */
.sec,.tipsh,.tm small,.hero .k,.lab2,.hero .hring b small{color:#F3C8F3!important}
.hring svg circle:last-child{stroke:#F3C8F3!important}
nav#nav button.on svg{color:#F3C8F3!important}
.pbar i{background:linear-gradient(90deg,#EA6244,#F3C8F3)!important}
.hojeP{background:rgba(243,200,243,.14)!important;color:#F3C8F3!important}
.st-part{color:#F3C8F3!important}
.toToday{color:#F3C8F3!important}
.hero::before{background:radial-gradient(circle,rgba(243,200,243,.26),transparent 66%)!important}
.mt::before{box-shadow:0 0 0 3px rgba(243,200,243,.10)}
.seg .pill{color:#E9D9EA}
/* ===== capa de abertura ===== */
#cover{position:fixed;inset:0;z-index:3000;background:#150F14;opacity:0;overflow:hidden;font-family:Figtree,system-ui,sans-serif}
body.cvon>*:not(#cover):not(script){visibility:hidden}
#cover .cvt{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(160deg,#FBE3FB,#EDB6EE);overflow:hidden;display:grid;place-items:center}
#cover .cvt svg{width:min(100%,420px);height:auto;transform:scale(1.12)}
#cover .cvx{position:absolute;left:32px;right:32px;bottom:calc(108px + env(safe-area-inset-bottom,0px));max-width:430px;margin:0 auto}
#cover .nm{font:800 19px "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:.3em;color:#F3C8F3}
#cover .ph{margin-top:16px;font:800 36px/1.14 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.03em;color:#FCE9D2}
#cover .bar{margin-top:22px;width:60px;height:5px;border-radius:3px;background:#EA6244}
#cover .cvs{position:absolute;left:32px;bottom:calc(44px + env(safe-area-inset-bottom,0px));padding:9px 16px;border-radius:999px;background:rgba(243,200,243,.14);color:#F3C8F3;font:700 14px Figtree,system-ui,sans-serif;letter-spacing:.06em}
.appic{display:block;width:96px;height:96px;border-radius:22.5%;margin-top:12px}

/* ---- ajustes de uso diário (nov/2026) ---- */
.back.bk2,.mobback{color:var(--ink)}
.back.bk2{background:var(--clay);border-radius:999px;padding:0 16px 0 10px;min-height:44px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15;box-shadow:0 8px 18px -10px rgba(0,0,0,.7)}
.mobback{margin:14px 0 0}
.mobsw{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);margin:6px 0 12px}
.mobsw button{flex:1;min-height:42px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.mobsw button.on{background:var(--card2);color:var(--text)}
.remrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 16px;margin:8px 0;border-radius:16px;background:var(--card)}
.remrow .sp{flex:1;min-width:0}.remrow b{display:block;font-size:14px;color:var(--text)}
.remrow small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remx{width:40px;height:44px;font-size:22px;line-height:1;color:var(--mute);flex:none}
.segs.grp{flex-wrap:nowrap;gap:11px}.segs.grp span{display:flex;gap:2px;flex:1 1 0;min-width:0}
.segs.grp i{flex:1 1 0;min-width:2px;max-width:none}
.gotr.go2{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:8px 16px;min-height:60px;text-align:left}.gotr.go2 small,.gotr.go2 b{grid-column:1;display:block}.gotr.go2 i{grid-column:2;grid-row:1/span 2}
.gotr.go2 small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75;flex:none;color:inherit!important}
.gotr.go2 b{flex:1;min-width:0;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gotr.go2 i{font-style:normal;font-size:22px;line-height:1;flex:none}
.tipsb{margin:4px 0 0}.tipsh{min-height:38px}
.wka{width:40px;height:44px;opacity:1;color:var(--text)}

.sinfo{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}
.sinfo b{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800;line-height:1;color:var(--text)}
.sinfo b u{text-decoration:none;font-size:17px;font-weight:600;color:var(--mute);margin:0 5px}
.sinfo small{color:var(--mute);font-size:13.5px}
.sgo{width:100%;min-height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16px;color:var(--ink);background:linear-gradient(180deg,#F4876B,#EA6244);box-shadow:0 12px 22px -12px rgba(234,98,68,.95),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s}
.sgo:active{transform:scale(.98)}.sgo svg{width:20px;height:20px}
.sgo.done{background:rgba(244,135,107,.14);color:#F4876B;box-shadow:none;font-weight:700;font-size:14.5px}
button.rstl{width:100%;text-align:left;min-height:40px}button.rstl small{margin-left:auto;font-size:12px;font-weight:600;color:var(--mute);opacity:.8}

/* ================= direção visual: camadas e relevo ================= */
html:root{--n0:#120910;--rim:rgba(255,255,255,.07);--pk:#E480BB;--rj:#F4876B;--fv:#EA6244;--ty:#601938;--cr:#FCE9D2;--dim:rgba(252,233,210,.62)}
html:root body{background:
  radial-gradient(70% 34% at -10% 0%,rgba(228,128,187,.22),transparent 70%),
  radial-gradient(80% 40% at 110% 2%,rgba(96,25,56,.75),transparent 72%),
  radial-gradient(90% 40% at 50% 108%,rgba(234,98,68,.10),transparent 70%),
  var(--n0)!important;background-attachment:fixed!important}

/* cabeçalho */
html:root body .dh{justify-content:space-between!important;margin:10px 2px 2px!important}
html:root body .dh b{font:700 19px/1 "Bricolage Grotesque",Figtree,sans-serif!important;letter-spacing:-.02em!important;text-transform:capitalize!important;color:var(--cr)!important}
html:root body .dh .st{font-size:12px!important;font-weight:600!important;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 var(--rim);color:var(--dim)!important}
html:root body .dh .st-part,html:root body .dh .st-fin{color:var(--rj)!important;background:rgba(244,135,107,.12)}
html:root body .phrase.tiny{color:var(--dim);font-size:13px;margin:4px 2px 12px}

/* semana: bandeja em relevo com discos */
html:root body .wkp{align-items:center;padding:12px 4px 10px;margin:0 0 16px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.03),0 18px 30px -22px #000}
html:root body .wka{width:30px!important;height:44px!important;font-size:22px!important;color:var(--dim)!important;opacity:1!important}
html:root body .wkd{gap:7px;min-width:36px}
html:root body .wkd small{font-size:10.5px;letter-spacing:.06em;color:rgba(252,233,210,.5)}
html:root body .wkd.cu small{color:var(--cr)}
html:root body .wkc{width:34px!important;height:34px!important;position:relative;background:#170B14!important;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07)!important}
html:root body .wkd.on .wkc{background:linear-gradient(160deg,#F4876B,#EA6244)!important;box-shadow:0 8px 16px -6px rgba(234,98,68,.8),inset 0 1px 0 rgba(255,255,255,.5)!important}
html:root body .wkd.on .wkc svg{color:#2A0E1E!important}
html:root body .wkd.part .wkc{background:conic-gradient(#F4876B 0 50%,#170B14 50% 100%)!important}
html:root body .wkd.td .wkc{box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 2px var(--n0),0 0 0 3.5px var(--pk),0 0 16px rgba(228,128,187,.55)!important}
html:root body .wkd.td:not(.on):not(.part) .wkc::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--pk)}
html:root body .wkd.td.on .wkc{box-shadow:0 0 0 2px var(--n0),0 0 0 3.5px var(--pk),0 8px 16px -6px rgba(234,98,68,.8)!important}

/* cartão do dia: a anilha como composição */
html:root body .hero.hx{position:relative;overflow:hidden;border:0!important;border-radius:30px!important;padding:24px 22px 20px!important;margin:0 0 16px!important;
  background:radial-gradient(85% 70% at 0% 0%,rgba(228,128,187,.30),transparent 62%),linear-gradient(158deg,#7B2149 0%,#601938 28%,#3B1230 62%,#1E0D1A 100%)!important;
  box-shadow:0 34px 54px -30px rgba(96,25,56,1),0 12px 24px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.05)!important}
html:root body .hero.hx .plate{position:absolute;width:340px;height:340px;right:-104px;top:-104px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(244,135,107,.30) 0,rgba(234,98,68,.16) 22%,transparent 52%),
   repeating-radial-gradient(circle,transparent 0 25px,rgba(255,255,255,.075) 25px 26px);
  -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
html:root body .hero.hx>*:not(.plate){position:relative;z-index:1}
html:root body .hero.hx .k{font-size:12.5px!important;letter-spacing:.02em!important;text-transform:none!important;font-weight:600!important;color:var(--pk)!important}
html:root body .hero.hx h1{font-size:46px!important;letter-spacing:-.04em!important;line-height:.95!important;margin:8px 0 8px!important;color:var(--cr);text-shadow:0 2px 18px rgba(30,13,26,.5)}
html:root body .hero.hx .hrt p{font-size:15px;color:rgba(252,233,210,.78);margin:0}
html:root body .hero.hx .hring{width:92px;height:92px;margin:-2px -2px 0 0;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(60,18,44,.9),rgba(24,10,20,.95));
  box-shadow:0 14px 26px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.14)}
html:root body .hero.hx .hring svg{width:92px;height:92px}
html:root body .hring svg circle.trk{stroke:rgba(252,233,210,.12)!important;stroke-width:6!important}
html:root body .hring svg circle.prg{stroke:url(#hrg)!important;stroke-width:6!important;filter:drop-shadow(0 0 5px rgba(244,135,107,.6))}
html:root body .hero.hx .hring b{font-size:27px!important;color:var(--cr)}
html:root body .hero.hx .hring b small{color:var(--dim)!important;font-size:14px}
html:root body .hero.hx .segs.grp{margin:22px 0 18px;gap:9px}
html:root body .hero.hx .segs.grp i{height:5px;border-radius:3px;background:rgba(20,8,17,.55);box-shadow:inset 0 1px 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07)}
html:root body .hero.hx .segs.grp i.on{background:linear-gradient(90deg,#F4876B,#EA6244);box-shadow:0 0 8px rgba(244,135,107,.6)}
/* ação principal: uma só linguagem para "começar" e "concluir" */
html:root body .gotr.go2,html:root body .ex.op .sgo{border-radius:20px!important;color:#2A0E1E!important;
  background:linear-gradient(180deg,#F8A38C 0%,#F07151 52%,#EA6244 100%)!important;
  box-shadow:0 20px 30px -16px rgba(234,98,68,.95),0 6px 10px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(140,38,0,.28)!important}
html:root body .gotr.go2{min-height:66px;padding:10px 10px 10px 20px}
html:root body .gotr.go2 small{font-size:12px!important;letter-spacing:.01em!important;text-transform:none!important;font-weight:600!important;opacity:.72}
html:root body .gotr.go2 b{font:700 18px/1.15 "Bricolage Grotesque",Figtree,sans-serif!important;letter-spacing:-.02em}
html:root body .gotr.go2 i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#3B1230,#1E0D1A);color:var(--rj);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 10px -6px rgba(0,0,0,.7)}
html:root body .gotr.go2 i svg{width:18px;height:18px;margin-left:2px}
html:root body .hero.hx .chips{margin-top:16px;gap:6px}
html:root body .hero.hx .chip{font-size:12.5px!important;font-weight:600;padding:6px 11px!important;border-radius:999px;color:rgba(252,233,210,.92)!important;

html:root body{background:

/* cores como variáveis: trocar a paleta passa a ser trocar estas linhas */
html:root:root{--s0:#200C19;--s1:#351326;--s2:#481C35;--s1a:rgba(53,19,38,.74);--s1b:rgba(53,19,38,.56);--tx2:#C9AEBB;--dim:#C9AEBB;--mute:#C9AEBB;--hair:rgba(255,242,235,.08)}

/* nível 1 (Dark Plum): cartões, linhas e exercícios fechados. Vidro tingido, relevo mantido */

/* feito: recua para o fundo */
html:root body .ex.cl.fin{background:rgba(53,19,38,.26)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)!important}
/* nível 2 (Berry Wine): o que fica por cima de um cartão */
html:root body .btn.dark,html:root body .dcx,html:root body .ib,html:root body .well .sl button{
  background:linear-gradient(180deg,#56223F,var(--s2))!important;color:var(--cr)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 12px -8px rgba(8,2,6,.8)!important}

/* os destaques continuam com superfície própria (degradê forte só aqui) */

  box-shadow:0 34px 54px -30px rgba(96,25,56,1),0 12px 24px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.05)!important}

esmos que vão carregar tudo o que ainda vem pela frente.", "Dois treinos no mesmo dia pedem duas coisas: água no intervalo e humildade com a carga à noite."], "3": ["Dia de bike é dia de deixar a cabeça respirar. O corpo pedala e a mente desacelera.", "No meio da semana, o descanso ativo é o que separa quem evolui de quem só se cansa.", "Nem todo dia precisa ser intenso para valer a pena. Alguns servem para que os intensos sejam possíveis.", "Pedalar sem pressa também é treino: o coração fica mais forte quando não está sendo testado.", "Recuperar não é parar. É dar ao músculo o tempo de transformar esforço em resultado.", "Mobilidade hoje é amplitude amanhã. Dez minutos que destravam o resto da semana."], "5": ["Fechar a semana com pernas é escolher terminar forte, não terminar cansada.", "Sexta tem uma vantagem: tudo o que você treinou até aqui já está jogando a seu favor.", "Glúteo arredondado é paciência com método: amplitude completa, contração no topo e semanas a fio.", "O último treino da semana é onde a constância deixa de ser promessa e vira prova.", "A carga que hoje parece pesada é a mesma que, daqui a um mês, vai parecer aquecimento.", "Termine a semana como quem coloca a última peça de algo que está construindo. Porque é isso que você está fazendo."], "6": ["Fim de semana com movimento é o jeito mais gentil de lembrar ao corpo tudo o que ele já sabe fazer.", "Bike no sábado é escolha, não obrigação. E as escolhas leves são as que a gente mantém por anos.", "Sem ficha e sem relógio apertado: hoje o treino é sobre o prazer de se mexer.", "A semana foi construída. Hoje é dia de aproveitar o corpo que você está construindo.", "Suor de sábado tem outro gosto: é o de quem treina porque quer, não porque precisa."]};window.gymFrase=function(d){var wd=d.getDay(),pool=window.GYM_FRASES[wd===4?2:wd],n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),w=Math.floor((n+3)/7)+(wd===4?3:0);return pool[((w%pool.length)+pool.length)%pool.length]};

function niceTicks(mn,mx,n){const r=(mx-mn)||1,raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p,lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st,t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(Math.round(v*100)/100);return t}
function tChart(series){

const ACTL={bike:"Bike indoor",fut:"Futevôlei",run:"Esteira",walk:"Caminhada",zumba:"Zumba",other:"Outra"};
function actList(d){const l=L(d),o=[];
  if(l.fut)o.push({id:"fut",label:ACTL.fut,kcal:l.futCal,min:l.futMin,k:"fut",n:0});
  if((l.bike||0)>0||l.bikeKcal)o.push({id:"bike",label:ACTL.bike,kcal:l.bikeKcal,n:l.bike||0,k:"bike"});
  (Array.isArray(l.act)?l.act:[]).forEach(a=>o.push({id:String(a.id),label:a.k==="other"?(a.n||ACTL.other):ACTL[a.k],kcal:a.kcal,min:a.min,k:a.k,n:0,per:a.per}));
  return o}
function weekActTotals(wk){const m={};let kcal=0;
  for(let i=0;i<7;i++)actList(addDays(wk,i)).forEach(x=>{const r=m[x.label]||(m[x.label]={label:x.label,n:0,kcal:0,dias:0});r.dias++;r.n+=x.n||0;r.kcal+=num(x.kcal)||0;kcal+=num(x.kcal)||0});
  return{rows:Object.values(m).sort((a,b)=>b.kcal-a.kcal),kcal:Math.round(kcal)}}
function actCard(d){
  const it=actList(d),inW=mondayOf(d)===mondayOf(todayStr()),hasBike=it.some(x=>x.k==="bike");
  let h='<div class="rg col actc"><div class="rgh"><span class="ri r-ex">'+ICN.flame+'</span><div class="rgt"><b>Atividade extra</b><small>'+(it.length?"Registradas neste dia":"Bike, caminhada, outra")+'</small></div>'+(hasBike?'<button class="pill sm2" data-a="bikeAdj" data-s="1" aria-label="Mais uma aula de bike">+1 bike</button>':"")+'<button class="pill ghost2" data-a="actAdd">+ Adicionar</button></div>';
  if(it.length)h+='<div class="acts2">'+it.map(x=>{const dt=[x.min?x.min+" min":"",x.kcal?x.kcal+" kcal":""].filter(Boolean).join(" · ");return'<button class="act" data-a="actEdit" data-id="'+esc(x.id)+'"><span class="ai">'+ICN.flame+'</span><span class="at"><b>'+esc(x.label)+(x.n?" ×"+x.n:"")+'</b>'+(dt?'<small>'+dt+'</small>':"")+'</span><i aria-hidden="true">›</i></button>'}).join("")+'</div>';
  if(inW){const t=weekActTotals(mondayOf(todayStr()));if(t.kcal>0)h+='<div class="row" style="margin-top:10px"><small class="sp">Semana: '+t.kcal+' kcal em atividades extras</small><button class="btn sm ghost" data-a="tab" data-t="semana">Ver semana</button></div>'}
  return h+'</div>'}

function reportData(start,end){
  const days=[];for(let d=start;d<=end;d=addDays(d,1))days.push(d);
  const R={start,end,n:days.length,pain:[],eff:[0,0,0,0,0],fin:0,mins:[],sets:0,fut:0,bike:0,abs:0,kcal:0,futKcal:0,calA:[],calT:[],knee:[],pr:[],obs:[],ex:[],meas:null};
  const byEx={};
  days.forEach(d=>{const l=L(d);if(l.fin){R.fin++;if(l.eff)R.eff[l.eff]++}if(l.start&&l.end)R.mins.push(wdur(l)/60000);if(l.fut)R.fut++;R.bike+=l.bike||0;R.abs+=absDone(d);R.kcal+=num(l.kcal)||0;R.futKcal+=num(l.futCal)||0;
    if(l.cal){if(l.cal.a)R.calA.push(l.cal.a);if(l.cal.t)R.calT.push(l.cal.t)}if(l.knee!=null)R.knee.push(l.knee);
    Object.keys(l.ex||{}).forEach(id=>{const e=l.ex[id];const nd=nDone(e);if(!nd||e.sub)return;R.sets+=nd;const ld=entLoad(e);(byEx[id]=byEx[id]||{n:e.n,s:[]}).s.push({d,ld});if(e.pr||e.sets.some(s=>s.pr))R.pr.push({d,n:e.n});if(e.obs)R.obs.push({d,n:e.n,t:e.obs});if(e.pain)R.pain.push({d,n:e.n})})});
  Object.keys(byEx).forEach(id=>{const b=byEx[id],s=b.s.filter(x=>x.ld);if(!s.length)return;let prev=null;Object.keys(S.logs).sort().forEach(k=>{if(k<start){const e=S.logs[k].ex&&S.logs[k].ex[id];if(e&&!e.sub&&nDone(e)&&entLoad(e))prev=entLoad(e)}});
    const a=prev!=null?prev:s[0].ld,z=s[s.length-1].ld;R.ex.push({n:b.n,a,z,pct:a?(z-a)/a*100:0,sess:b.s.length})});
  const am={};days.forEach(d=>actList(d).forEach(x=>{const r=am[x.label]||(am[x.label]={label:x.label,n:0,kcal:0,min:0,dias:0});r.dias++;r.n+=x.n||0;r.kcal+=num(x.kcal)||0;r.min+=num(x.min)||0}));R.acts=Object.values(am).sort((a,b)=>b.kcal-a.kcal);
  R.ex.sort((x,y)=>y.pct-x.pct);
  const ms=(S.core.evo||[]).filter(m=>m.d>=start&&m.d<=end&&["p","c","q","x"].some(k=>m[k]!=null)).sort((a,b)=>a.d<b.d?-1:1);if(ms.length){const pick=(k,f)=>{const r=ms.filter(m=>m[k]!=null);return r.length?r[f?0:r.length-1]:null};R.meas={a:{p:(pick("p",1)||{}).p,c:(pick("c",1)||{}).c,q:(pick("q",1)||{}).q,x:(pick("x",1)||{}).x},z:{p:(pick("p",0)||{}).p,c:(pick("c",0)||{}).c,q:(pick("q",0)||{}).q,x:(pick("x",0)||{}).x}}}
  return R}
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function reportLines(R){
  const o=[];const am=avgOf(R.mins);
  o.push(["h","Resumo"]);
  o.push(["l","Período: "+fdate(R.start)+" a "+fdate(R.end)+" ("+R.n+" dias)"]);
  o.push(["l","Treinos finalizados: "+R.fin+" | Séries concluídas: "+R.sets]);
  o.push(["l","Tempo médio de treino: "+(am?Math.round(am)+" min":"sem registro")+(R.mins.length?" | Tempo total: "+Math.round(R.mins.reduce((x,y)=>x+y,0))+" min":"")]);
  {const t=R.eff.reduce((a,b)=>a+b,0);if(t)o.push(["l","Esforço dos treinos: "+[1,2,3,4].filter(n=>R.eff[n]).map(n=>EFFL[n]+" "+R.eff[n]).join(", ")])}
  o.push(["l","Futevôlei: "+R.fut+" dia(s) | Bike indoor: "+R.bike+" aula(s) | Abdômen: "+R.abs+" repetições"]);

  S.core.evo=S.core.evo||[];(c.evo||[]).forEach(r=>{if(r&&/^\d{4}-\d{2}-\d{2}$/.test(r.d||"")&&SRCL[r.s]){r.id=r.id||("i"+r.s+r.d);if(!S.core.evo.some(q=>q.id===r.id)){S.core.evo.push(r);n++}}});
  S.core.aval=S.core.aval||[];(c.aval||[]).forEach(a=>{if(a&&a.id!=null&&!S.core.aval.some(q=>String(q.id)===String(a.id))){S.core.aval.push(a);m++}});
  if(n||m){S.core.evoM=S.core.evoM||c.evoM||1;if(c.evoSeed)S.core.evoSeed=1;modCore();persist()}
  closeSheet();render();toast(n||m?"Evolução importada: "+n+" registros e "+m+" avaliações":"Não havia nada novo na evolução")}catch(e){toast("Arquivo inválido.")}}
function doImport(txt){
  try{const x=JSON.parse(txt);if(x&&x.type==="gym-arquivo"){restoreArchive(x);return}if(!x||!x.core||!x.logs)throw 0;try{localStorage.setItem(KEY+".prev",JSON.stringify(S))}catch(e){}S.core=x.core;S.logs=x.logs;ensure();S.ts={core:Date.now()};for(const k in S.logs)S.ts["m-"+k.slice(0,7)]=Date.now();dirtyCore=true;Object.keys(S.logs).forEach(k=>dirtyM.add(k.slice(0,7)));persist();applyTheme();closeSheet();render();toast("Dados importados")}
  catch(e){toast("Arquivo inválido. Use um backup exportado pelo Gym.")}}

    case"repSnooze":S.core.rep.snooze=todayStr();modCore();render();break;
    case"export":doExport(false);break;
    case"shareBk":doExport(true);break;
    case"bkLater":S.core.bkSnooze=addDays(todayStr(),3);modCore();render();break;
    case"arcLater":S.core.arcSnooze=addDays(todayStr(),7);modCore();render();break;
    case"arcExp":{const m=D.m;saveFiles(archiveFiles(m)).then(ok=>{if(ok){S.core.mExp=S.core.mExp||{};S.core.mExp[m]=todayStr();modCore();toast("Arquivo de "+monthName(m)+" gerado");render()}});break}
    case"arcAsk":{const m=D.m;openSheet('<h2>Compactar '+monthName(m)+'?</h2><p>Você guardou o arquivo deste mês no notebook?</p><p class="mute" style="font-size:13.5px">O app vai manter as cargas, as séries feitas, os recordes e os números da Evolução, e apagar o detalhe de cada série e as observações. Dá para desfazer logo depois, ou restaurar o mês importando o arquivo.</p><div class="acts"><button class="btn blk" data-a="arcDo" data-m="'+m+'">Sim, compactar</button><button class="btn blk ghost" data-a="closeSheet">Ainda não</button></div>');break}
    case"arcDo":{const n=compactMonth(D.m);closeSheet();render();toast("Mês compactado ("+n+" registros)");break}
    case"undoImport":{try{const x=JSON.parse(localStorage.getItem(KEY+".prev")||"null");if(x&&x.core&&x.logs){S=x;ensure();S.ts={core:Date.now()};for(const k in S.logs)S.ts["m-"+k.slice(0,7)]=Date.now();dirtyCore=true;Object.keys(S.logs).forEach(k=>dirtyM.add(k.slice(0,7)));localStorage.removeItem(KEY+".prev");persist();applyTheme();render();toast("Importação desfeita")}}catch(e){toast("Não foi possível desfazer")}break}
    case"copyJson":copyText(exportJson());S.core.lastBackup=todayStr();modCore();toast("Dados copiados");render();break;
    case"importSheet":openSheet('<h2>Importar dados</h2><p class="mute">Escolha o arquivo de backup ou cole o conteúdo.</p><p class="mute" style="font-size:13.5px"><b>Só a evolução</b> acrescenta o peso, as medidas e as avaliações do arquivo e mantém os seus treinos. <b>Importar tudo</b> substitui todos os dados atuais.</p><input type="file" accept=".json,application/json" id="impf" class="fld" style="height:auto;padding:10px"><label class="lab" for="impt">Ou cole aqui</label><textarea class="fld" id="impt" rows="4"></textarea><div class="acts" style="margin-top:12px"><button class="btn" data-a="importEvo">Só a evolução</button><button class="btn ghost" data-a="importGo">Importar tudo</button><button class="btn ghost" data-a="closeSheet">Cancelar</button></div>');break;
    case"importEvo":{const f=$("#impf").files[0];if(f){const r=new FileReader();r.onload=()=>mergeEvo(String(r.result));r.readAsText(f)}else mergeEvo($("#impt").value);break}
    case"importGo":{const f=$("#impf").files[0];if(f){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}else doImport($("#impt").value);break}
    case"resetPlan":openSheet('<h2>Restaurar ficha original?</h2><p>As cargas e mudanças na ficha voltam ao padrão. O histórico de treinos é mantido.</p><div class="acts"><button class="btn" data-a="resetOk">Restaurar</button><button class="btn ghost" data-a="closeSheet">Cancelar</button></div>');break;
    case"resetOk":S.core.plan=clone(PLAN0);S.core.sugg={};modCore();closeSheet();render();break;
    case"summary":{const t=weeklyText();openSheet('<h2>Resumo para o personal</h2><textarea class="fld" id="sumt" rows="12" readonly>'+esc(t)+'</textarea><div class="acts" style="margin-top:12px"><button class="btn" data-a="copySum">Copiar texto</button><button class="btn ghost" data-a="closeSheet">Fechar</button></div>');break}
    case"copySum":copyText($("#sumt").value);toast("Texto copiado");break;
    case"tadd":if(T){if(T.done){T.done=false;T.doneAt=0;T.end=Date.now()+15000;T.total=15;const lb=$("#tlab");if(lb)lb.textContent=T.label;const sk=document.querySelector('#timer button[data-a="tskip"]');if(sk)sk.textContent="Pular";const tm=$("#timer");if(tm)tm.classList.remove("fin")}else{T.end+=15000;T.total+=15}tick()}break;
    case"tskip":stopTimer();break;
    case"closeSheet":closeSheet();render();break;
  }
});
window.addEventListener("scroll",()=>{const u=document.getElementById("up");if(u)u.classList.toggle("on",(window.scrollY||document.documentElement.scrollTop||0)>450)},{passive:true});
document.addEventListener("input",e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==="ld"){const ex=findEx(el.dataset.ex);ex.l=num(el.value);syncLoad(ex);modCore();const en=L(cur).ex&&L(cur).ex[ex.id];if(en&&nDone(en)){en.load=ex.l;mod(cur)}refreshMeta(ex)}
  else if(k==="sr"){const ex=findEx(el.dataset.ex);if(ex)srSet(ex,el.dataset.k,el.value)}
   else if(k==="obs"){const ex=findEx(el.dataset.ex),en=exEntry(cur,ex);en.obs=el.value;mod(cur)}
  else if(k==="futH"||k==="bikeH"){S.core.set[k]=el.value.trim();modCore()}
  else if(k==="bibQ"){const q=nrm(el.value);document.querySelectorAll(".bibr").forEach(r=>{r.style.display=!q||r.dataset.q.indexOf(q)>=0?"":"none"});document.querySelectorAll(".bibg").forEach(g=>{g.style.display=Array.from(g.querySelectorAll(".bibr")).some(r=>r.style.display!=="none")?"":"none"})}
  else if(k==="note"){S.core.notes[el.dataset.ex]=el.value;modCore()}
  else if(k==="cal"){const l=L(cur,true);l.cal=l.cal||{};l.cal[el.dataset.k]=num(el.value);mod(cur)}
  else if(k==="actF"){const key=el.dataset.k;actForm[key]=key==="name"?el.value:num(el.value)}
  else if(k==="bikeKcal"){const l=L(cur,true);l.bikeKcal=num(el.value);mod(cur)}
  else if(k==="kcal"){const l=L(cur,true);l.kcal=num(el.value);mod(cur)}
  else if(k==="futCal"){const l=L(cur,true);l.futCal=num(el.value);mod(cur)}
  else if(k==="meas"){let m=S.core.meas.find(x=>x.d===cur);if(!m){m={d:cur};S.core.meas.push(m)}m[el.dataset.k]=num(el.value);modCore()}
});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.in==="evoSel"){evoEx=el.value;render()}});

/* ---------- início ---------- */
setTimeout(checkRem,1500);
loadLocal();askPersist();FRESH0=!(S.ts.core>0);if(migrated){modCore();migrated=false}applyTheme();closeWeeks();render();wake();initCloud();
})();
